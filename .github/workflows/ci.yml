name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ATLAS_PYTHON: python
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Analysis and API tests
        run: python -m pytest -q
      - name: Graph algorithm tests
        run: npm run test:layout
      - name: Renderer and application icons
        run: |
          npm run build
          python scripts/create_icon.py
      - name: End-to-end desktop investigation (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end desktop investigation (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: Build and verify bundled analysis engine
        run: python scripts/build_engine.py
      - name: Package desktop application
        run: npx electron-builder --publish never
      - name: Verify packaged application (Linux)
        if: runner.os == 'Linux'
        env:
          ATLAS_EXECUTABLE: ${{ github.workspace }}/release/linux-unpacked/atlas
        run: xvfb-run -a npm run test:e2e
      - name: Verify packaged application (Windows)
        if: runner.os == 'Windows'
        env:
          ATLAS_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\Atlas.exe
        run: npm run test:e2e
      - name: Upload ready-to-run applications
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-${{ runner.os }}-1.0.0
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
      - name: Upload screenshots and diagnostic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-verification-${{ runner.os }}
          path: |
            docs/screenshots/
            test-results/
            playwright-report/
          if-no-files-found: ignore

  release:
    name: Publish verified Atlas release
    needs: build
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Atlas-*-1.0.0
          path: artifacts
          merge-multiple: true
      - name: Independent verifier and checksums
        run: |
          cp scripts/verify_bundle.py artifacts/verify_bundle.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          folder=Path('artifacts')
          lines=[]
          for source in sorted(folder.iterdir()):
              if not source.is_file():
                  continue
              digest=hashlib.sha256()
              with source.open('rb') as stream:
                  for block in iter(lambda:stream.read(1024*1024),b''):
                      digest.update(block)
              lines.append(f'{digest.hexdigest()}  {source.name}\n')
          (folder/'SHA256SUMS.txt').write_text(''.join(lines))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Atlas 1.0.0
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
