name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ATLAS_PYTHON: python
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - name: Analysis and API tests
        run: python -m pytest -q
      - name: Graph algorithm tests
        run: npm run test:layout
      - name: Renderer and application icons
        run: |
          npm run build
          python scripts/create_icon.py
      - name: End-to-end desktop investigation (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end desktop investigation (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: Build and verify bundled analysis engine
        run: python scripts/build_engine.py
      - name: Package desktop application
        run: npx electron-builder --publish never
      - name: Upload ready-to-run applications
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-${{ runner.os }}-1.0.0
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: error
      - name: Upload screenshots and diagnostic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-verification-${{ runner.os }}
          path: |
            docs/screenshots/
            test-results/
            playwright-report/
          if-no-files-found: ignore
